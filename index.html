<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستم آنلاین تعقیب و پیگیری - وزارت شهرسازی و مسکن</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .logo { max-width: 100px; margin-bottom: 20px; }
        h2 { color: #1e3a8a; margin-bottom: 25px; font-size: 20px; }
        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; color: #4b5563; }
        input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #1e3a8a; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>وزارت شهرسازی و مسکن</h2>
    <h3>سیستم آنلاین تعقیب و پیگیری احکام</h3>
    
    <form id="loginForm">
        <div class="form-group">
            <label for="email">ایمیل آدرس رسمی:</label>
            <input type="email" id="email" placeholder="example@mudh.gov.af" required>
        </div>
        <div class="form-group">
            <label for="password">رمز عبور:</label>
            <input type="password" id="password" placeholder="******" required>
        </div>
        <button type="submit">ورود به سیستم</button>
    </form>
</div>

</body>
</html>
