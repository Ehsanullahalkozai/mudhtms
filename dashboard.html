<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUDH-TMS | اسناد او د فایل محدودیتونه</title>
    <!-- Supabase JS CDN -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header-box { text-align: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 20px; position: relative; }
        h1 { color: #1e3a8a; margin: 0; font-size: 24px; }
        .btn-logout { background: #1e293b; color: white; padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; float: left; font-weight: bold; }
        .info-bar { background: #fffbeb; border: 1px solid #fef3c7; color: #92400e; padding: 12px; border-radius: 25px; display: inline-block; margin-top: 10px; font-weight: bold; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: center; vertical-align: middle; }
        th { background-color: #1e3a8a; color: white; }
        tr:nth-child(even) { background-color: #f8fafc; }
        .delay-row { background-color: #fee2e2 !important; color: #991b1b; } /* د تأخیر لرونکو د ردیف د سور کېدو لپاره */
        .status-btn { padding: 6px 16px; border-radius: 20px; font-size: 14px; font-weight: bold; border: 1px solid #cbd5e1; display: inline-block; min-width: 90px; text-align: center; }
        .approved { background-color: #dcfce7; color: #166534; border-color: #bbf7d0; }
        .review { background-color: #f1f5f9; color: #475569; border-color: #e2e8f0; }
        .pending { background-color: #fef9c3; color: #854d0e; border-color: #fef08a; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-box">
            <button class="btn-logout" onclick="handleLogout()">وتل</button>
            <h1>د ښار جوړولو او مسکن وزارت د احکامو تعقیب</h1>
            <div class="info-bar">اسناد او د فایل محدودیتونه - هر فایل 10 MB | ذخیره: Supabase Storage bucket documents</div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>شمېره</th>
                    <th>سرلیک / حکم</th>
                    <th>څانګه (Agency)</th>
                    <th>حالت</th>
                    <th>وروستۍ نېټه (Deadline)</th>
                    <th>د تأخیر ورځې</th>
                </tr>
            </thead>
            <tbody id="lettersTableBody">
                <!-- لایو ډیټا به دلته په اتومات ډول رندر شي -->
            </tbody>
        </table>
    </div>

    <script>
        // ستاسو د ډیټابیس نښلول
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR3d3VhcWhhdm95b2hrc293dW9tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MTU4NjYxOTIsImV4cCI6MjAyOTQyNjE5Mn0.Your_Actual_Key_Here"; // کیلي مو اتوماتیک پیوند لري
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadDashboardLetters() {
            const { data: letters, error } = await _supabase.from('letters').select('*').order('id', { ascending: false });
            const tbody = document.getElementById('lettersTableBody');
            tbody.innerHTML = "";

            if (error) return;

            letters.forEach(letter => {
                const tr = document.createElement('tr');
                
                // د کلمې چک کول که حالت تأخیرخورده وي، قطار سور کوي
                if (letter.current_status === 'تأخیرخورده') {
                    tr.classList.add('delay-row');
                }

                // د بټنونو د سټایل منطق پخوانی بڼه
                let badgeStyle = 'pending';
                let currentStatus = letter.current_status || 'pending';
                
                if (currentStatus === 'approved' || currentStatus === 'تحقق‌یافته') badgeStyle = 'approved';
                if (currentStatus === 'review') badgeStyle = 'review';
                if (currentStatus === 'pending') badgeStyle = 'pending';

                tr.innerHTML = `
                    <td>${letter.letter_number || 'MUDH-1405-00' + letter.id}</td>
                    <td style="font-weight: bold; text-align: right; white-space: pre-line;">${letter.subject || 'بې سرلیکه مکتوب'}</td>
                    <td style="color: #475569;">${letter.referred_to_agency || 'General'}</td>
                    <td><span class="status-btn ${badgeStyle}">${currentStatus}</span></td>
                    <td style="direction: ltr;">${letter.deadline_date || '---'}</td>
                    <td style="color: #dc2626; font-weight: bold;">${letter.total_delay_days > 0 ? letter.total_delay_days + ' ورځې' : '---'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function handleLogout() {
            _supabase.auth.signOut();
            window.location.href = "index.html";
        }

        window.onload = loadDashboardLetters;
    </script>
</body>
</html>
