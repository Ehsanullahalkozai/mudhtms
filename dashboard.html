<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUDH-TMS | اسناد او د فایل محدودیتونه</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #1e3a8a; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 10px; overflow: hidden; }
        th, td { border: 1px solid #e2e8f0; padding: 15px; text-align: center; }
        th { background-color: #1e3a8a; color: white; font-weight: bold; }
        tr:nth-child(even) { background-color: #f8fafc; }
        .delay-row { background-color: #fee2e2 !important; color: #991b1b; }
        .status-badge { padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; display: inline-block; }
        .approved { background: #dcfce7; color: #166534; }
        .review { background: #f1f5f9; color: #475569; }
        .pending { background: #fef9c3; color: #854d0e; }
        .btn { background: #1e3a8a; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; float: left; }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn" style="background: #dc2626;" onclick="localStorage.clear(); window.location.href='index.html';">وتل</button>
        <h1>د ښار جوړولو او مسکن وزارت د احکامو تعقیب</h1>
        
        <table>
            <thead>
                <tr>
                    <th>شمېره</th>
                    <th>سرلیک / حکم</th>
                    <th>څانګه (Agency)</th>
                    <th>حالت</th>
                    <th>وروستۍ نېټه (Deadline)</th>
                    <th>د تأخیر ورځې</th>
                </tr>
            </thead>
            <tbody id="lettersTableBody">
                <!-- ډیټا له جاواسکریپټ څخه دلته راځي -->
            </tbody>
        </table>
    </div>
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
