<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUDH-TMS | ډشبورډ او د احکامو تعقیب</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { color: #1e3a8a; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: right; }
        th { background-color: #1e3a8a; color: white; }
        tr:nth-child(even) { background-color: #f8fafc; }
        .delay-row { background-color: #fee2e2 !important; color: #991b1b; } /* د تأخیر لرونکو لپاره سور رنګ */
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-progress { background: #dbeafe; color: #1e40af; }
        .badge-success { background: #dcfce7; color: #166534; }
        .badge-delay { background: #fee2e2; color: #991b1b; }
        .btn { background: #1e3a8a; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>د ښار جوړولو او مسکن وزارت د احکامو آنلاین سیسټم</h1>
            <button class="btn" style="background: #dc2626;" onclick="handleLogout()">وتل</button>
        </div>

        <!-- د مکتوبونو جدول -->
        <h2>د مکتوبونو او احکامو لیست</h2>
        <table>
            <thead>
                <tr>
                    <th>موضوع / حکم</th>
                    <th>مسؤل مرجع (ریاست)</th>
                    <th>وروستۍ نېټه (Deadline)</th>
                    <th>د کار وضعیت</th>
                    <th>د تأخیر ورځې</th>
                </tr>
            </thead>
            <tbody id="lettersTableBody">
                <!-- ډیټا به دلته له لایو څخه راځي -->
            </tbody>
        </table>
    </div>

    <script>
        // ستاسو د سپابیس لایو تنظیمات
        const SUPABASE_URL = "https://twwuaqhavoyohksowuom.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."; // خپل اصلي کیلي دلته د ننه کړئ
        const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadLetters() {
            const { data: letters, error } = await supabase.from('letters').select('*');
            const tbody = document.getElementById('lettersTableBody');
            tbody.innerHTML = "";

            if (error) return;

            letters.forEach(letter => {
                const tr = document.createElement('tr');
                
                // د څلورم پړاو منطق: که کار تأخیر شوی وي، د ردیف رنګ سور کوي
                if (letter.current_status === 'تأخیرخورده') {
                    tr.classList.add('delay-row');
                }

                let badgeClass = 'badge-progress';
                if(letter.current_status === 'تحقق‌یافته') badgeClass = 'badge-success';
                if(letter.current_status === 'تأخیرخورده') badgeClass = 'badge-delay';

                tr.innerHTML = `
                    <td>${letter.referred_to_agency || 'بې سرلیکه'}</td>
                    <td>${letter.referred_to_agency || 'نامشخص'}</td>
                    <td>${letter.deadline_date || 'نه ده ټاکل شوې'}</td>
                    <td><span class="badge ${badgeClass}">${letter.current_status || 'در جریان'}</span></td>
                    <td style="font-weight:bold;">${letter.total_delay_days > 0 ? letter.total_delay_days + ' ورځې' : '---'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function handleLogout() {
            supabase.auth.signOut();
            window.location.href = "index.html";
        }

        // د پاڼې د خلاصېدو سره سم د احکامو راوستل
        window.onload = loadLetters;
    </script>
</body>
</html>
